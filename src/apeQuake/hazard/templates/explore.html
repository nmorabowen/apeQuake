<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>IG-EPN Seismic Hazard Explorer</title>
<!--__LEAFLET__-->
<style>
  /* Design tokens: reference data-viz palette. Every map color is a role below, so the
     light and dark sets swap in one place. Hazard = one-hue blue ramp (flips in dark);
     source-zone types = the only identity hues (validated all-pairs, both modes);
     faults / epicenters / sites = ink with a surface ring. */
  :root {
    color-scheme: light;
    --surface:#fcfcfb; --page:#f9f9f7; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,.10);
    --panel:rgba(252,252,251,.96); --shadow:0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.08);
    --zone-crustal:#eb6834; --zone-interface:#1baf7a; --zone-inslab:#4a3aa7; --zone-background:#898781;
    --focus:#2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface:#1a1a19; --page:#0d0d0d; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
      --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
      --panel:rgba(26,26,25,.96); --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.45);
      --zone-crustal:#d95926; --zone-interface:#199e70; --zone-inslab:#9085e9; --zone-background:#898781;
      --focus:#3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface:#1a1a19; --page:#0d0d0d; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
    --panel:rgba(26,26,25,.96); --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.45);
    --zone-crustal:#d95926; --zone-interface:#199e70; --zone-inslab:#9085e9; --zone-background:#898781;
    --focus:#3987e5;
  }

  html, body { height:100%; margin:0; background:var(--page); color:var(--ink);
               font:13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #map { position:absolute; inset:0; background:var(--page); }
  .leaflet-container { font:inherit; }
  :focus-visible { outline:2px solid var(--focus); outline-offset:1px; }

  /* panel */
  .panel { background:var(--panel); color:var(--ink); border:1px solid var(--ring); border-radius:10px;
           padding:12px 14px; box-shadow:var(--shadow); width:252px; box-sizing:border-box;
           backdrop-filter:blur(6px); }
  .panel h1 { font-size:14px; font-weight:600; margin:0; cursor:pointer; user-select:none;
              display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .panel h1 .chev { color:var(--muted); font-weight:400; font-size:12px; }
  .panel .sub { color:var(--ink-2); font-size:11.5px; margin:2px 0 8px; }
  .panel.collapsed .body, .panel.collapsed .sub { display:none; }
  .sec { border-top:1px solid var(--grid); margin-top:10px; padding-top:8px; }
  .sec-h { font-size:11px; font-weight:600; color:var(--ink-2); text-transform:none; margin-bottom:4px; }
  .panel label { display:block; color:var(--ink-2); font-size:11px; margin:6px 0 2px; }
  .panel select, .panel input[type=number], .panel input[type=text] {
    width:100%; box-sizing:border-box; font:inherit; font-size:12.5px; color:var(--ink);
    padding:4px 6px; border:1px solid var(--baseline); border-radius:6px; background:var(--surface); }
  .panel input[type=range] { width:100%; accent-color:var(--focus); }
  .row { display:flex; gap:8px; } .row > * { flex:1; min-width:0; }
  .note { color:var(--ink-2); font-size:11px; margin-top:6px; }
  .note.warn { color:var(--ink); }
  .seg { display:flex; border:1px solid var(--baseline); border-radius:6px; overflow:hidden; }
  .seg button { flex:1; border:0; border-radius:0; background:transparent; color:var(--ink-2);
                font:inherit; font-size:11.5px; padding:3px 0; cursor:pointer; }
  .seg button + button { border-left:1px solid var(--baseline); }
  .seg button[aria-pressed="true"] { background:var(--grid); color:var(--ink); font-weight:600; }
  .btn { font:inherit; font-size:12px; padding:4px 10px; border:1px solid var(--baseline);
         border-radius:6px; background:var(--surface); color:var(--ink); cursor:pointer; }
  .btn:hover, .seg button:hover { background:var(--grid); }

  /* legend (sequential) */
  .legend .cap { font-size:11px; color:var(--ink-2); }
  .legend .bar { position:relative; height:10px; border-radius:3px; margin:6px 0 16px;
                 box-shadow:inset 0 0 0 1px var(--ring); }
  .legend .tick { position:absolute; top:12px; transform:translateX(-50%); font-size:10.5px;
                  color:var(--ink-2); font-variant-numeric:tabular-nums; white-space:nowrap; }
  .legend .tick::before { content:""; position:absolute; top:-4px; left:50%; width:1px; height:3px;
                          background:var(--muted); }

  /* overlay key (mirrors the marks) */
  .key { display:grid; grid-template-columns:22px 1fr; gap:3px 6px; align-items:center;
         font-size:11.5px; color:var(--ink-2); }
  .key:empty::before { content:"Turn layers on with the stack button."; grid-column:1/-1; font-size:11px; }
  .key svg { display:block; }

  /* popups & tooltips */
  .leaflet-popup-content-wrapper, .leaflet-popup-tip, .leaflet-tooltip {
    background:var(--surface); color:var(--ink); box-shadow:var(--shadow); }
  .leaflet-popup-content-wrapper { border-radius:10px; border:1px solid var(--ring); }
  .leaflet-popup-content { margin:12px 14px; }
  .leaflet-container a.leaflet-popup-close-button { color:var(--muted); }
  .leaflet-tooltip { border:1px solid var(--ring); border-radius:6px; padding:5px 8px; }
  .leaflet-tooltip-top:before, .leaflet-tooltip-bottom:before,
  .leaflet-tooltip-left:before, .leaflet-tooltip-right:before { display:none; }
  .tt .v { font-weight:650; font-size:13px; }
  .tt .c { color:var(--ink-2); font-size:11px; }
  .site-label { background:var(--surface); border:1px solid var(--ring); color:var(--ink);
                font-size:11.5px; font-weight:600; padding:2px 6px; box-shadow:none; }
  .pop h2 { font-size:13px; margin:0; font-weight:650; }
  .pop .meta { color:var(--ink-2); font-size:11px; margin:1px 0 6px; }
  .pop table { border-collapse:collapse; font-size:12px; width:100%;
               font-variant-numeric:tabular-nums; }
  .pop th { color:var(--ink-2); font-weight:500; font-size:11px; text-align:right; padding:2px 6px;
            border-bottom:1px solid var(--grid); }
  .pop td { text-align:right; padding:1px 6px; color:var(--ink-2); }
  .pop td.m { color:var(--ink); font-weight:600; }
  .pop th:first-child, .pop td:first-child { text-align:left; padding-left:0; color:var(--ink-2); font-weight:400; }
  .pop tr.hl td { background:var(--grid); }
  .pop .src { color:var(--muted); font-size:10.5px; margin-top:6px; }
  .pop svg text { fill:var(--ink-2); font-size:9.5px; }
  .leaflet-control-layers { background:var(--panel); color:var(--ink); border:1px solid var(--ring) !important;
                            border-radius:10px !important; box-shadow:var(--shadow) !important; }
  .leaflet-control-layers-expanded { padding:8px 12px 8px 8px; }
  .leaflet-control-layers-separator { border-top-color:var(--grid); }
  .leaflet-bar a { background:var(--panel); color:var(--ink); border-bottom-color:var(--grid); }
  .leaflet-control-attribution { background:var(--panel) !important; color:var(--ink-2); }
  .leaflet-control-attribution a { color:var(--ink-2); }
  .leaflet-control-scale-line { background:var(--panel); color:var(--ink-2); border-color:var(--muted); }

  /* pick & point: numbered ink pins with a surface ring (identity by number on the map) */
  .pin { display:flex; align-items:center; justify-content:center; border-radius:50%;
         background:var(--ink); color:var(--surface); font:600 11px/1 system-ui, sans-serif;
         box-shadow:0 0 0 2px var(--surface), 0 1px 4px rgba(0,0,0,.35); cursor:grab; }
  .pin.out { background:var(--muted); }
  .pin:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  .picking, .picking .leaflet-interactive { cursor:crosshair !important; }
  .btn[aria-pressed="true"] { background:var(--ink); color:var(--surface); border-color:var(--ink); }
  .picks { list-style:none; margin:6px 0 0; padding:0; max-height:168px; overflow:auto; }
  .picks li { display:grid; grid-template-columns:20px 1fr auto 18px; gap:6px; align-items:center;
              padding:3px 2px; border-radius:6px; cursor:pointer; font-size:11.5px; }
  .picks li:hover, .picks li:focus-visible { background:var(--grid); }
  .picks .n { width:18px; height:18px; border-radius:50%; background:var(--ink); color:var(--surface);
              display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; }
  .picks .n.out { background:var(--muted); }
  .picks .ll { color:var(--ink-2); font-variant-numeric:tabular-nums; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .picks .v { color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums; }
  .picks .x { border:0; background:transparent; color:var(--muted); cursor:pointer; font-size:14px; padding:0; }
  .picks .x:hover { color:var(--ink); }
  .picks:empty::before { content:"Turn on Pick, then click the map. Pins can be dragged."; color:var(--ink-2); font-size:11px; }
  .btns { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .btns[hidden] { display:none; }
  .panel .body { max-height:calc(100vh - 120px); overflow-y:auto; overscroll-behavior:contain;
                 margin-right:-8px; padding-right:8px; }
  .btns .btn { padding:3px 8px; font-size:11.5px; }
  .pop .actions { margin-top:8px; display:flex; gap:6px; }
  dialog.cmp { border:1px solid var(--ring); border-radius:12px; padding:0; background:var(--surface);
               color:var(--ink); box-shadow:var(--shadow); width:min(760px, 94vw); max-height:88vh; }
  dialog.cmp::backdrop { background:rgba(0,0,0,.35); }
  dialog.cmp header { display:flex; justify-content:space-between; align-items:baseline; gap:12px;
                      padding:14px 18px 6px; }
  dialog.cmp h2 { font-size:15px; margin:0; }
  dialog.cmp .sub { color:var(--ink-2); font-size:12px; }
  dialog.cmp .body { padding:4px 18px 16px; overflow:auto; max-height:calc(88vh - 60px); }
  dialog.cmp svg text { fill:var(--ink-2); font-size:10.5px; }
  dialog.cmp table { border-collapse:collapse; font-size:12px; margin-top:10px; width:100%;
                     font-variant-numeric:tabular-nums; }
  dialog.cmp th { color:var(--ink-2); font-weight:500; font-size:11px; text-align:right; padding:3px 6px;
                  border-bottom:1px solid var(--grid); white-space:nowrap; }
  dialog.cmp td { text-align:right; padding:3px 6px; border-bottom:1px solid var(--grid); white-space:nowrap; }
  dialog.cmp th:first-child, dialog.cmp td:first-child { text-align:left; }
  dialog.cmp tr.hl td { background:var(--grid); }
  dialog.cmp textarea { width:100%; box-sizing:border-box; min-height:150px; font:12px/1.45 ui-monospace, Consolas, monospace;
                        color:var(--ink); background:var(--page); border:1px solid var(--baseline); border-radius:8px; padding:8px; }
  .swatch { display:inline-block; width:14px; height:2px; vertical-align:middle; margin-right:6px; border-radius:1px; }

  /* isometric 3D view */
  #isoview { position:fixed; inset:0; z-index:2000; background:var(--surface); display:flex; flex-direction:column; outline:none; }
  #isoview[hidden] { display:none; }
  #isoview canvas { display:block; cursor:grab; touch-action:none; }
  #isoview canvas:active { cursor:grabbing; }
  .iso-bar { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; padding:10px 14px;
             border-bottom:1px solid var(--grid); font-size:12.5px; color:var(--ink); }
  .iso-bar .iso-cap { color:var(--ink-2); flex:1; min-width:180px; }
  .iso-bar label { color:var(--ink-2); display:flex; align-items:center; gap:6px; }
  .iso-bar input[type=range] { width:110px; accent-color:var(--focus); }
  .iso-help { position:absolute; left:14px; bottom:12px; color:var(--muted); font-size:11px; }
  .iso-legend { position:absolute; left:14px; top:60px; width:220px; background:var(--panel);
                border:1px solid var(--ring); border-radius:8px; padding:8px 10px 2px; }
  .iso-legend .bar { margin-bottom:18px; }
  .iso-tip { position:fixed; pointer-events:none; z-index:2001; }
  @media (max-width: 600px) { .panel { width:210px; padding:10px; } }
  @media (forced-colors: active) { .legend .bar { forced-color-adjust:none; } }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Seismic hazard map of Ecuador"></div>
<script id="hazard-data" type="application/json">/*__DATA__*/</script>
<script>
(function () {
"use strict";
if (!window.L) {        // map library blocked (sandboxed viewer, or CDN mode offline)
  document.getElementById("map").innerHTML =
    '<div style="max-width:440px;margin:15vh auto;padding:16px 20px;border:1px solid var(--baseline);' +
    'border-radius:10px;background:var(--surface);color:var(--ink)"><b>The map library did not load.</b>' +
    '<p style="color:var(--ink-2)">This viewer blocked the Leaflet script. Open the file in a web browser, ' +
    'or regenerate it with <code>hz.explore(..., inline_leaflet=True)</code> (the default), which embeds ' +
    'the library in the file.</p></div>';
  return;
}
const D = JSON.parse(document.getElementById("hazard-data").textContent);
const PERIODS = D.periods, STATS = D.stats, TRS = D.trs;          // TRS = [475, 2475]
const iMean = STATS.indexOf("mean"), iLo = STATS.indexOf("q16"), iHi = STATS.indexOf("q84");

// ------------------------------------------------------------------ helpers
const fmt = (v, n = 3) => (v == null || !isFinite(v)) ? "–" : (+v).toFixed(n);
const pLabel = (T) => T === 0 ? "PGA" : `Sa(${T} s)`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g,
  (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tok = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ------------------------------------------------------------------ copy to clipboard
// Tables copy as tab-separated text: one paste into Excel / Sheets fills the columns.
// Getters run at click time, so the copy always matches what is on screen.
const copyReg = new Map(); let copySeq = 0;
function copyButton(getText, label = "Copy values") {
  const k = "c" + (++copySeq); copyReg.set(k, getText);
  return `<button class="btn" data-cp="${k}" title="Tab-separated: pastes into Excel / Sheets as columns">${label}</button>`;
}
async function copyText(text, btn) {
  const done = (msg) => { if (!btn) return; const old = btn.dataset.label || btn.textContent;
    btn.dataset.label = old; btn.textContent = msg; setTimeout(() => { btn.textContent = old; }, 1400); };
  try { await navigator.clipboard.writeText(text); done("Copied ✓"); return; } catch (e) { /* fall back */ }
  const ta = document.createElement("textarea");           // sandboxed viewers: legacy path
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false; try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
  ta.remove();
  if (ok) done("Copied ✓"); else { prompt("Copy these values (Ctrl+C):", text); }
}
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-cp]"); if (!b) return;
  const get = copyReg.get(b.dataset.cp); if (get) copyText(get(), b);
});
const tsv = (rows) => rows.map(r => r.join("\t")).join("\n") + "\n";
function cellTsv(cell, tr, lat, lon, label) {
  const head = [["# " + (label || `cell ${cell.id}`), `lat ${(+lat).toFixed(5)}`, `lon ${(+lon).toFixed(5)}`,
                 `TR ${tr} yr`, "rock Vs30 = 760 m/s", "IG-EPN"],
                ["T [s]", "mean [g]", "q16 [g]", "q84 [g]"]];
  return tsv(head.concat(PERIODS.map((T, p) => [T,
    fmt(saAt(cell, tr, iMean, p), 4), fmt(saAt(cell, tr, iLo, p), 4), fmt(saAt(cell, tr, iHi, p), 4)])));
}
function picksTsv() {
  const head = ["point", "lat", "lon", "cell", `TR [yr]`, "stat", ...PERIODS.map(T => T === 0 ? "PGA [g]" : `Sa(${T} s) [g]`)];
  return tsv([head, ...picks.map(pk => [pk.id, pk.lat.toFixed(5), pk.lng.toFixed(5), pk.cell ? pk.cell.id : "outside",
    state.tr, STATS[state.s], ...PERIODS.map((_, p) => pk.cell ? fmt(saAt(pk.cell, state.tr, state.s, p), 4) : "")])]);
}


// v[tr][stat][period] flattened: index = (t * STATS.length + s) * PERIODS.length + p
const published = (cell, t, s, p) => cell.v[(t * STATS.length + s) * PERIODS.length + p];

// lambda = k0 Sa^-k through the two published points (same as apeQuake.hazard.curves)
function saAt(cell, tr, s, p) {
  const a = published(cell, 0, s, p), b = published(cell, 1, s, p);
  if (tr === TRS[0]) return a;
  if (tr === TRS[1]) return b;
  const k = Math.log(TRS[1] / TRS[0]) / Math.log(b / a);
  return Math.pow((1 / TRS[0]) * Math.pow(a, k) * tr, 1 / k);
}

// ------------------------------------------------------------------ theme
const THEME_KEY = "igepn-explorer-theme";
function storedTheme() { try { return localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { return "auto"; } }
function isDark() {
  const t = document.documentElement.dataset.theme;
  return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function setTheme(mode) {
  if (mode === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = mode;
  try { localStorage.setItem(THEME_KEY, mode); } catch (e) { /* private mode: not remembered */ }
}
setTheme(storedTheme());

// sequential blue ramp, low -> high value (validated steps 100..700); flips in dark mode
const BLUE = ["#cde2fb","#b7d3f6","#9ec5f4","#86b6ef","#6da7ec","#5598e7","#3987e5",
              "#2a78d6","#256abf","#1c5cab","#184f95","#104281","#0d366b"];
const rampSteps = () => isDark() ? BLUE.slice().reverse() : BLUE;
const rgb = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function color(x, lo, hi) {
  if (!isFinite(x)) return tok("--muted");
  const steps = rampSteps().map(rgb);
  let t = (x - lo) / ((hi - lo) || 1); t = Math.min(1, Math.max(0, t)) * (steps.length - 1);
  const i = Math.min(steps.length - 2, Math.floor(t)), f = t - i;
  const c = steps[i].map((v, j) => Math.round(v + f * (steps[i + 1][j] - v)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
// ordinal steps (validated sets) for ordered series, low -> high
const ORD = { light: { 1:[7], 2:[3,9], 3:[3,7,11], 4:[3,6,9,12], 5:[3,5,7,9,12] },
              dark:  { 1:[6], 2:[8,0], 3:[10,5,0], 4:[10,6,3,0], 5:[10,8,5,2,0] } };
const ordinal = (n) => ORD[isDark() ? "dark" : "light"][Math.min(Math.max(n, 1), 5)].map(i => BLUE[i]);

// ------------------------------------------------------------------ state
// a shared link (#tr=..&m=..&s=..&pts=lat,lon;lat,lon) overrides the initial view
function parseHash() {
  const h = new URLSearchParams(location.hash.slice(1)), out = {};
  const tr = +h.get("tr"), m = +h.get("m"), st = STATS.indexOf(h.get("s"));
  if (tr > 0) out.tr = tr;
  if (Number.isInteger(m) && m >= 0 && m < PERIODS.length && h.has("m")) out.p = m;
  if (st >= 0) out.s = st;
  if (h.get("pts")) out.pts = h.get("pts").split(";").map(x => x.split(",").map(Number))
    .filter(a => a.length === 2 && a.every(isFinite) && Math.abs(a[0]) <= 90 && Math.abs(a[1]) <= 180);
  return out;
}
const HASH = parseHash();
const state = { tr: HASH.tr ?? D.init.tr, p: HASH.p ?? PERIODS.indexOf(D.init.period),
                s: HASH.s ?? STATS.indexOf(D.init.stat), opacity: 0.7, lo: 0, hi: 1, hover: null };

// ------------------------------------------------------------------ map + base layers
const map = L.map("map", { preferCanvas: true, zoomSnap: 0.5, zoomControl: true })
  .setView([-1.6, -78.6], 7);
window.hazardMap = map;                       // for scripting / debugging from the console
// panes keep the stacking explicit: hazard cells < overlays < hover outline
map.createPane("hazard").style.zIndex = 350;
map.createPane("hover").style.zIndex = 450;
map.getPane("hover").style.pointerEvents = "none";
const hazardCanvas = L.canvas({ pane: "hazard", padding: 0.5 });
const canvas = L.canvas({ padding: 0.5, tolerance: 4 });   // tolerance widens hit targets
const hoverCanvas = L.canvas({ pane: "hover", padding: 0.5 });
const ESRI = "https://server.arcgisonline.com/ArcGIS/rest/services/";
const esriAttr = "Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors";
const grayLight = L.tileLayer(ESRI + "Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16, attribution: esriAttr });
const grayDark = L.tileLayer(ESRI + "Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16, attribution: esriAttr });
const autoBase = L.layerGroup();               // follows the theme
const bases = {
  "Gray (follows theme)": autoBase,
  "OpenStreetMap": L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }),
  "Terrain (OpenTopoMap)": L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    { maxZoom: 17, attribution: "&copy; OpenStreetMap contributors, SRTM | &copy; OpenTopoMap (CC-BY-SA)" }),

// popup chart: ordered return periods share one hue, direct-labelled; crosshair on hover
function uhsSvg(cell, tr) {
  const W = 268, H = 150, m = { l: 30, r: 46, t: 10, b: 22 };
  const xs = PERIODS, xmax = Math.max(...xs);
  const trs = Array.from(new Set([TRS[0], tr, TRS[1]])).sort((a, b) => a - b);
  const cols = ordinal(trs.length);
  let ymax = 0;
  trs.forEach(t => xs.forEach((_, p) => {
    ymax = Math.max(ymax, saAt(cell, t, TRS.includes(t) ? iHi : iMean, p)); }));
  const yt = [0.1, 0.2, 0.25, 0.5, 1].find(s => ymax / s <= 5) || 1;
  ymax = Math.ceil(ymax / yt) * yt;
  const X = (x) => m.l + (x / xmax) * (W - m.l - m.r);
  const Y = (y) => H - m.b - (y / ymax) * (H - m.t - m.b);
  const path = (vals) => vals.map((y, i) => `${i ? "L" : "M"}${X(xs[i]).toFixed(1)},${Y(y).toFixed(1)}`).join("");
  let g = "";
  for (let y = 0; y <= ymax + 1e-9; y += yt) {
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(y)}" y2="${Y(y)}" stroke="${tok("--grid")}" stroke-width="1"/>` +
         `<text x="${m.l - 4}" y="${Y(y) + 3}" text-anchor="end">${+y.toFixed(2)}</text>`;
  }
  [0, 0.5, 1, 1.5, 2].forEach(t => g += `<text x="${X(t)}" y="${H - 7}" text-anchor="middle">${t}</text>`);
  g += `<text x="${W - m.r}" y="${H - 7}" text-anchor="end" dx="40">T [s]</text>`;
  const ends = [];
  trs.forEach((t, k) => {
    const col = cols[k];
    if (TRS.includes(t)) {
      const lo = xs.map((_, p) => saAt(cell, t, iLo, p)), hi = xs.map((_, p) => saAt(cell, t, iHi, p));
      g += `<path d="${path(hi)}${lo.slice().reverse().map((y, i) => `L${X(xs[xs.length - 1 - i]).toFixed(1)},${Y(y).toFixed(1)}`).join("")}Z" fill="${col}" opacity="0.13"/>`;
    }
    const mean = xs.map((_, p) => saAt(cell, t, iMean, p));
    g += `<path d="${path(mean)}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"` +
         (TRS.includes(t) ? "" : ` stroke-dasharray="4 3"`) + `/>`;
    ends.push({ y: Y(mean[mean.length - 1]), t, col });
  });
  ends.sort((a, b) => a.y - b.y);
  for (let i = 1; i < ends.length; i++) ends[i].ly = Math.max(ends[i].y, (ends[i - 1].ly ?? ends[i - 1].y) + 11);
  ends[0].ly = ends[0].y;
  ends.forEach(e => {
    const x0 = X(xmax);
    g += `<line x1="${x0 + 3}" x2="${x0 + 9}" y1="${e.ly}" y2="${e.ly}" stroke="${e.col}" stroke-width="2"/>` +
         `<text x="${x0 + 12}" y="${e.ly + 3}">${e.t} yr</text>`;
  });
  g += `<line class="xh" x1="0" x2="0" y1="${m.t}" y2="${H - m.b}" stroke="${tok("--muted")}" stroke-width="1" visibility="hidden"/>`;
  xs.forEach((x, p) => {
    const a = p ? (X(xs[p - 1]) + X(x)) / 2 : m.l, b = p < xs.length - 1 ? (X(x) + X(xs[p + 1])) / 2 : W - m.r;
    g += `<rect data-p="${p}" data-x="${X(x)}" x="${a}" y="${m.t}" width="${b - a}" height="${H - m.t - m.b}" fill="transparent"/>`;
  });
  return `<svg class="uhs" width="${W}" height="${H}" role="img" aria-label="Uniform hazard spectra at ${trs.join(", ")} years">${g}</svg>`;
}
function wireCrosshair(root) {
  const svg = root.querySelector("svg.uhs"); if (!svg) return;
  const xh = svg.querySelector(".xh"), rows = root.querySelectorAll("tbody tr");
  svg.querySelectorAll("rect[data-p]").forEach(r => {
    r.addEventListener("pointerenter", () => {
      xh.setAttribute("x1", r.dataset.x); xh.setAttribute("x2", r.dataset.x); xh.setAttribute("visibility", "visible");
      rows.forEach((tr, i) => tr.classList.toggle("hl", i === +r.dataset.p));
    });
  });
  svg.addEventListener("pointerleave", () => { xh.setAttribute("visibility", "hidden"); rows.forEach(tr => tr.classList.remove("hl")); });
}

function openCell(cell, latlng) {
  const how = TRS.includes(state.tr) ? "published" :

  const rows = PERIODS.map((T, p) =>

    <div class="meta">Cell ${esc(cell.id)} · ${fmt(latlng.lat, 4)}, ${fmt(latlng.lng, 4)}</div>

// ------------------------------------------------------------------ point lookup
function inRing(x, y, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
  }
  return inside;
}
// bounding boxes first: cellAt runs on every mouse move
const cellIndex = D.cells.features.map(f => {
  const g = f.geometry, polys = g.type === "MultiPolygon" ? g.coordinates : [g.coordinates];
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  polys.forEach(p => p[0].forEach(([x, y]) => { x0 = Math.min(x0, x); x1 = Math.max(x1, x);
                                                y0 = Math.min(y0, y); y1 = Math.max(y1, y); }));
  return { f, polys, x0, x1, y0, y1 };
});
const cellFeature = new Map(D.cells.features.map(f => [f.properties.id, f]));
function cellAt(lat, lon) {
  for (const c of cellIndex) {
    if (lon < c.x0 || lon > c.x1 || lat < c.y0 || lat > c.y1) continue;
    for (const poly of c.polys)
      if (inRing(lon, lat, poly[0]) && !poly.slice(1).some(h => inRing(lon, lat, h))) return c.f.properties;
  }
  return null;
}

function niceTicks(lo, hi, n = 5) {
  const span = hi - lo, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => span / s <= n) || 10 * mag;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}

    `<span class="tick" style="left:${(100 * (v - state.lo) / ((state.hi - state.lo) || 1)).toFixed(1)}%">${v}</span>`).join("");
  $("cap").textContent = `${pLabel(PERIODS[state.p])} [g] · TR ${state.tr} yr · ${STATS[state.s]}`;
  const out = state.tr < TRS[0] || state.tr > TRS[1];

function addPick(latlng, opts = {}) {
  const pk = { id: nextId++, lat: latlng.lat, lng: latlng.lng, cell: cellAt(latlng.lat, latlng.lng) };
  pk.marker = L.marker(latlng, { icon: pinIcon(pk), draggable: true, pane: "pins", keyboard: true,
                                 title: `Point ${pk.id}`, autoPan: true })
    .on("drag", (e) => { pk.lat = e.latlng.lat; pk.lng = e.latlng.lng; })
    .on("dragend", () => {
      pk.cell = cellAt(pk.lat, pk.lng); pk.marker.setIcon(pinIcon(pk));
      renderPicks(); saveState(); openPick(pk);
    })
    .on("click", () => openPick(pk))
    .addTo(pinLayer);
  picks.push(pk);
  renderPicks();
  if (!opts.silent) { saveState(); openPick(pk); }
  return pk;
}

function removePick(id) {
  const pk = picks.find(p => p.id === id); if (!pk) return;

function compareSvg(list) {
  const W = 700, H = 300, m = { l: 40, r: 40, t: 12, b: 28 };
  const xs = PERIODS, xmax = Math.max(...xs);
  let ymax = 0;
  list.forEach(pk => xs.forEach((_, p) => { ymax = Math.max(ymax, saAt(pk.cell, state.tr, state.s, p)); }));
  const yt = [0.1, 0.2, 0.25, 0.5, 1].find(v => ymax / v <= 6) || 1;
  ymax = Math.ceil(ymax / yt) * yt || 1;
  const X = (x) => m.l + (x / xmax) * (W - m.l - m.r), Y = (y) => H - m.b - (y / ymax) * (H - m.t - m.b);
  let g = "";
  for (let y = 0; y <= ymax + 1e-9; y += yt) g +=
    `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(y)}" y2="${Y(y)}" stroke="${tok("--grid")}"/>` +
    `<text x="${m.l - 6}" y="${Y(y) + 3.5}" text-anchor="end">${+y.toFixed(2)}</text>`;
  [0, 0.25, 0.5, 0.75, 1, 1.25, 1.5, 1.75, 2].forEach(t =>
    g += `<text x="${X(t)}" y="${H - 9}" text-anchor="middle">${t}</text>`);
  g += `<text x="${m.l}" y="${m.t + 2}" dy="-2">Sa [g]</text><text x="${W - m.r}" y="${H - 9}" dx="34" text-anchor="end">T [s]</text>`;
  const ends = [];
  list.forEach(pk => {
    const v = xs.map((_, p) => saAt(pk.cell, state.tr, state.s, p));
    const d = v.map((y, i) => `${i ? "L" : "M"}${X(xs[i]).toFixed(1)},${Y(y).toFixed(1)}`).join("");
    g += `<path d="${d}" fill="none" stroke="${slot(pk.id)}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    v.forEach((y, i) => g += `<circle cx="${X(xs[i])}" cy="${Y(y)}" r="3.5" fill="${slot(pk.id)}" stroke="${tok("--surface")}" stroke-width="2"/>`);
    ends.push({ y: Y(v[v.length - 1]), id: pk.id });
  });
  ends.sort((a, b) => a.y - b.y);
  ends.forEach((e, i) => { e.ly = i ? Math.max(e.y, ends[i - 1].ly + 12) : e.y; });
  ends.forEach(e => g +=
    `<line x1="${X(xmax) + 4}" x2="${X(xmax) + 14}" y1="${e.y}" y2="${e.ly}" stroke="${tok("--baseline")}"/>` +
    `<text x="${X(xmax) + 17}" y="${e.ly + 3.5}" font-weight="600" style="fill:var(--ink)">${e.id}</text>`);
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" role="img" aria-label="Uniform hazard spectra of the picked points">${g}</svg>`;
}

// ------------------------------------------------------------------ isometric 3D view
// Prisms extruded from the real cell polygons; height and color both encode Sa (the
// second channel keeps values readable where prisms hide each other). Painter's
// algorithm back to front, Lambert shading on the sides, province outlines on the
// ground, pins as needles. Drag rotates, Shift-drag pans, the wheel zooms.
const ISO = (() => {
  const lat0 = -1.6, lon0 = -78.4, kx = 111.32 * Math.cos(lat0 * Math.PI / 180), ky = 110.57;
  const toKm = ([lon, lat]) => [(lon - lon0) * kx, (lat - lat0) * ky];
  const ccw = (r) => { let a = 0; for (let i = 0; i < r.length; i++) { const [x1, y1] = r[i], [x2, y2] = r[(i + 1) % r.length]; a += x1 * y2 - x2 * y1; } return a > 0 ? r : r.slice().reverse(); };
  const prisms = [];
  D.cells.features.forEach(f => {
    const g = f.geometry, polys = g.type === "MultiPolygon" ? g.coordinates : [g.coordinates];
    polys.forEach(poly => {
      let ring = poly[0].map(toKm);
      if (ring.length > 1) { const [a, b] = [ring[0], ring[ring.length - 1]]; if (a[0] === b[0] && a[1] === b[1]) ring.pop(); }
      ring = ccw(ring);
      const cx = ring.reduce((s, p) => s + p[0], 0) / ring.length, cy = ring.reduce((s, p) => s + p[1], 0) / ring.length;
      prisms.push({ cell: f.properties, ring, cx, cy });
    });
  });
  const ground = (D.provinces.features || []).flatMap(f => {
    const g = f.geometry; if (!g) return [];
    const polys = g.type === "MultiPolygon" ? g.coordinates : [g.coordinates];
    return polys.map(p => p[0].map(toKm));
  });
  const view = { az: -28, el: 38, s: 1, px: 0, py: 0, exag: 1 };
  let root, cv, ctx, tip, W = 0, H = 0, dpr = 1, frame = 0, tops = [], vmax = 1, fast = false;

  function build() {
    root = document.createElement("div"); root.id = "isoview"; root.hidden = true;
    root.innerHTML = `<div class="iso-bar">
        <b>3D view</b><span class="iso-cap" id="isocap"></span>
        <label>Height ×<input id="isoex" type="range" min="0.3" max="3" step="0.1" value="1"></label>
        <button class="btn" id="isoreset">Reset view</button><button class="btn" id="isoclose">Close (Esc)</button></div>
      <canvas id="isocv" aria-label="Isometric 3D view of the hazard; drag to rotate, scroll to zoom"></canvas>
      <div class="iso-help">Drag: rotate · Shift+drag: pan · Wheel: zoom · Arrows: rotate</div>
      <div class="iso-legend legend" id="isolegend"></div>
      <div class="leaflet-tooltip iso-tip" id="isotip" hidden></div>`;
    document.body.appendChild(root);
    cv = root.querySelector("#isocv"); ctx = cv.getContext("2d"); tip = root.querySelector("#isotip");
    root.querySelector("#isoclose").onclick = close;
    root.querySelector("#isoreset").onclick = () => { Object.assign(view, { az: -28, el: 38, px: 0, py: 0 }); fit(); draw(); };
    root.querySelector("#isoex").oninput = (e) => { view.exag = +e.target.value; draw(); };
    let drag = null;
    cv.addEventListener("pointerdown", (e) => { drag = { x: e.clientX, y: e.clientY, pan: e.shiftKey }; cv.setPointerCapture(e.pointerId); tip.hidden = true; });
    cv.addEventListener("pointermove", (e) => {
      if (drag) {
        const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
        if (drag.pan) { view.px += dx; view.py += dy; }
        else { view.az += dx * 0.4; view.el = Math.min(80, Math.max(12, view.el + dy * 0.3)); }
        fast = true; schedule();
      } else hover(e);
    });
    const end = () => { if (drag) { drag = null; fast = false; draw(); } };
    cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
    cv.addEventListener("pointerleave", () => { tip.hidden = true; });
    cv.addEventListener("wheel", (e) => {
      e.preventDefault();
      const r = cv.getBoundingClientRect(), mx = e.clientX - r.left - W / 2 - view.px, my = e.clientY - r.top - H / 2 - view.py;
      const k = Math.pow(1.0015, -e.deltaY);
      view.s *= k; view.px -= mx * (k - 1); view.py -= my * (k - 1); draw();
    }, { passive: false });
    window.addEventListener("resize", () => { if (!root.hidden) { size(); draw(); } });
    root.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft") { view.az -= 8; draw(); } if (e.key === "ArrowRight") { view.az += 8; draw(); }
      if (e.key === "ArrowUp") { view.el = Math.min(80, view.el + 5); draw(); } if (e.key === "ArrowDown") { view.el = Math.max(12, view.el - 5); draw(); }
    });
    root.tabIndex = -1;
  }
  function size() {
    dpr = window.devicePixelRatio || 1;
    W = root.clientWidth; H = root.clientHeight - root.querySelector(".iso-bar").offsetHeight;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    cv.style.width = W + "px"; cv.style.height = H + "px";
  }
  function fit() {               // country (~700 km) fills most of the canvas
    view.s = Math.min(W, H * 1.5) / 820;
  }
  const hScale = () => 140 * view.exag / vmax;      // km of height per g
  function proj(x, y, z) {
    const a = view.az * Math.PI / 180, e = view.el * Math.PI / 180;
    const xr = x * Math.cos(a) - y * Math.sin(a), yr = x * Math.sin(a) + y * Math.cos(a);
    return [W / 2 + view.px + view.s * xr, H / 2 + view.py + 40 - view.s * (yr * Math.sin(e) + z * Math.cos(e)), yr];
  }
  function shade(rgbStr, k) {
    const m = rgbStr.match(/\d+/g).map(Number);
    return `rgb(${m.slice(0, 3).map(v => Math.round(v * k)).join(",")})`;
  }
  function schedule() { cancelAnimationFrame(frame); frame = requestAnimationFrame(draw); }
  function draw() {
    if (!root || root.hidden) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = tok("--surface"); ctx.fillRect(0, 0, W, H);
    const a = view.az * Math.PI / 180, sa = Math.sin(a), ca = Math.cos(a);
    // ground: province outlines
    ctx.strokeStyle = tok("--baseline"); ctx.lineWidth = 1;
    ground.forEach(r => { ctx.beginPath(); r.forEach(([x, y], i) => { const [sx, sy] = proj(x, y, 0); i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy); }); ctx.stroke(); });
    // prisms back to front
    const LIGHT = [0.45, -0.75];                              // light from the north-west
    const order = prisms.map(p => ({ p, d: p.cx * sa + p.cy * ca })).sort((u, v) => v.d - u.d);
    tops = [];
    for (const { p } of order) {
      const v = saAt(p.cell, state.tr, state.s, state.p);
      if (!isFinite(v)) continue;
      const z = v * hScale(), col = color(v, state.lo, state.hi);
      const base = p.ring.map(([x, y]) => proj(x, y, 0)), top = p.ring.map(([x, y]) => proj(x, y, z));
      if (!fast) {
        for (let i = 0; i < p.ring.length; i++) {
          const j = (i + 1) % p.ring.length, [x1, y1] = p.ring[i], [x2, y2] = p.ring[j];
          const nx = y2 - y1, ny = -(x2 - x1), nyr = nx * sa + ny * ca;     // outward normal, view y
          if (nyr >= 0) continue;                                          // faces away
          const len = Math.hypot(nx, ny) || 1, lam = (nx * LIGHT[0] + ny * LIGHT[1]) / len;
          ctx.fillStyle = shade(col, 0.62 + 0.22 * Math.max(-1, Math.min(1, lam)));
          ctx.beginPath(); ctx.moveTo(base[i][0], base[i][1]); ctx.lineTo(base[j][0], base[j][1]);
          ctx.lineTo(top[j][0], top[j][1]); ctx.lineTo(top[i][0], top[i][1]); ctx.closePath(); ctx.fill();
        }
      }
      ctx.fillStyle = col; ctx.strokeStyle = col; ctx.lineWidth = 0.6;
      ctx.beginPath(); top.forEach(([sx, sy], i) => i ? ctx.lineTo(sx, sy) : ctx.moveTo(sx, sy)); ctx.closePath();
      ctx.fill(); ctx.stroke();
      tops.push({ p, v, pts: top });
    }
    // pins and sites as needles
    const needles = picks.filter(pk => pk.cell).map(pk => ({ lat: pk.lat, lng: pk.lng, cell: pk.cell, label: String(pk.id) }))
      .concat(D.points.map(pt => ({ lat: pt.lat, lng: pt.lon, cell: cellAt(pt.lat, pt.lon), label: pt.label })));
    needles.forEach(nd => {
      if (!nd.cell) return;
      const [x, y] = toKm([nd.lng, nd.lat]), v = saAt(nd.cell, state.tr, state.s, state.p), z = v * hScale();
      const [gx, gy] = proj(x, y, z), [tx, ty] = proj(x, y, z + 30);   // rises from the prism top
      ctx.strokeStyle = tok("--ink"); ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(tx, ty); ctx.stroke();
      ctx.fillStyle = tok("--ink"); ctx.beginPath(); ctx.arc(tx, ty, 9, 0, 2 * Math.PI); ctx.fill();
      ctx.strokeStyle = tok("--surface"); ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = tok("--surface"); ctx.font = "600 10px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(nd.label.length > 3 ? "•" : nd.label, tx, ty + 0.5);
      if (nd.label.length > 3) { ctx.fillStyle = tok("--ink"); ctx.textAlign = "left"; ctx.fillText(nd.label, tx + 12, ty); }
    });
    // compass
    const [ox, oy] = [W - 46, H - 46], nAng = -view.az * Math.PI / 180;
    ctx.strokeStyle = tok("--muted"); ctx.fillStyle = tok("--ink-2"); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(ox, oy, 18, 0, 2 * Math.PI); ctx.stroke();
    const nx = ox + 14 * Math.sin(-nAng), ny = oy - 14 * Math.cos(-nAng) * Math.sin(view.el * Math.PI / 180);
    ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(nx, ny); ctx.stroke();
    ctx.font = "600 10px system-ui, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("N", ox + 26 * Math.sin(-nAng), oy - 26 * Math.cos(-nAng) * Math.sin(view.el * Math.PI / 180));
  }
  function inPoly(x, y, pts) {
    let ins = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) ins = !ins;
    }
    return ins;
  }
  function hover(e) {
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    for (let i = tops.length - 1; i >= 0; i--) {                 // front-most first
      if (inPoly(x, y, tops[i].pts)) {
        tip.innerHTML = `<div class="tt"><div class="v">${fmt(tops[i].v, 2)} g</div><div class="c">cell ${esc(tops[i].p.cell.id)} · ${pLabel(PERIODS[state.p])} · ${state.tr} yr · ${STATS[state.s]}</div></div>`;
        tip.hidden = false; tip.style.left = (e.clientX + 14) + "px"; tip.style.top = (e.clientY + 14) + "px";
        return;
      }
    }
    tip.hidden = true;
  }
  function caption() {
    root.querySelector("#isocap").textContent = `${pLabel(PERIODS[state.p])} · TR ${state.tr} yr · ${STATS[state.s]} · height and color = Sa`;
    root.querySelector("#isolegend").innerHTML = $("bar").outerHTML.replace('id="bar"', "") +
      `<div class="cap">${pLabel(PERIODS[state.p])} [g]</div>`;
  }
  function open() {
    if (!root) build();
    vmax = Math.max(state.hi, 0.05);
    root.hidden = false; size(); fit(); caption(); draw(); root.focus();
  }
  function close() { if (root) { root.hidden = true; tip.hidden = true; } }
  return { open, close, isOpen: () => root && !root.hidden,
           refresh: () => { if (root && !root.hidden) { vmax = Math.max(state.hi, 0.05); caption(); draw(); } } };
})();
$("iso").onclick = () => ISO.open();
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && ISO.isOpen()) ISO.close(); });
$("pcopy").onclick = (e) => copyText(picksTsv(), e.currentTarget);

restorePicks();   // before the first refresh(), whose saveState() would overwrite the stored pins
applyTheme();
})();
</script>
</body>
</html>
